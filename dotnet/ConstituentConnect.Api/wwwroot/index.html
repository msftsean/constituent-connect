<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Constituent Connect</title><style>body{font:16px system-ui;max-width:760px;margin:3rem auto;padding:1rem}textarea,button{width:100%;margin:.5rem 0;padding:.7rem}pre{white-space:pre-wrap;background:#f4f4f4;padding:1rem}</style></head>
<body><h1>Constituent Connect</h1><p>Local synthetic demonstration. Emergency requests receive guidance only; this app never dispatches.</p><textarea id="message" rows="5">Where do I apply for a replacement professional license?</textarea><button id="send">Create review draft</button><pre id="result" aria-live="polite"></pre><script>
document.getElementById('send').onclick=async()=>{const r=await fetch('/api/respond',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({channel:'web',message:message.value})});result.textContent=JSON.stringify(await r.json(),null,2)}
</script></body></html>
